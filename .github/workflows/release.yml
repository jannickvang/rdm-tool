name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-15
            args: --mac dmg --arm64
            files: |
              release/*-mac-arm64.dmg
          - name: macOS-x64
            os: macos-15-intel
            args: --mac dmg --x64
            files: |
              release/*-mac-x64.dmg
          - name: Windows
            os: windows-2022
            args: --win nsis --x64
            files: |
              release/*-windows-x64.exe
          - name: Linux
            os: ubuntu-24.04
            args: --linux AppImage deb --x64
            files: |
              release/*-linux-x64.AppImage
              release/*-linux-x64.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) { console.error("Tag must match package.json version"); process.exit(1) }'
      - run: npm ci
      - run: npm test
      - name: Package application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- ${{ matrix.args }} --publish never
      - name: Check expected installers
        shell: bash
        env:
          REQUIRED_FILES: ${{ matrix.files }}
        run: |
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            if ! compgen -G "$pattern" > /dev/null; then
              echo "Missing expected installer: $pattern" >&2
              exit 1
            fi
          done <<< "$REQUIRED_FILES"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "$RELEASE_TAG" --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
